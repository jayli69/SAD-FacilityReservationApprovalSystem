<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — Facility Reservation System</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <div><strong>Facility Reservation System</strong><span id="roleBadge" class="badge"></span></div>
  <button id="logoutBtn" class="btn secondary">Logout</button>
</header>

<nav class="tabs">
  <button data-tab="dashboard" class="active">Dashboard</button>
  <button data-tab="facilities">Facilities</button>
  <button data-tab="reservations">Reservations</button>
  <button data-tab="services">Service Requests</button>
  <button data-tab="audit">Audit Logs</button>
</nav>

<main class="container">
  <section id="dashboard" class="tab-panel active">
    <h2>Dashboard</h2>
    <div class="stats">
      <div class="stat"><span id="statFacilities">0</span><small>Facilities</small></div>
      <div class="stat"><span id="statPending">0</span><small>Pending</small></div>
      <div class="stat"><span id="statApproved">0</span><small>Approved/Scheduled</small></div>
      <div class="stat"><span id="statCompleted">0</span><small>Completed</small></div>
    </div>
    <div class="card">
      <h3>Current Account</h3>
      <p id="currentUser"></p>
      <p class="muted">Use the tabs above according to your role permissions.</p>
    </div>
  </section>

  <section id="facilities" class="tab-panel">
    <div class="section-head"><h2>Facilities</h2><button id="addFacilityBtn" class="btn primary admin-only">Add Facility</button></div>
    <div id="facilityFormWrap" class="card hidden">
      <h3 id="facilityFormTitle">Add Facility</h3>
      <form id="facilityForm" class="grid-form">
        <input id="facilityId" type="hidden">
        <div><label>Name</label><input id="facilityName" required></div>
        <div><label>Location</label><input id="facilityLocation" required></div>
        <div><label>Capacity</label><input id="facilityCapacity" type="number" min="1" required></div>
        <div><label>Condition</label><select id="facilityCondition"><option>Good</option><option>Needs Repair</option><option>Maintenance</option></select></div>
        <div class="full"><label>Status</label><select id="facilityStatus"><option>Active</option><option>Inactive</option></select></div>
        <div class="full actions"><button class="btn primary">Save</button><button type="button" id="cancelFacility" class="btn secondary">Cancel</button></div>
      </form>
    </div>
    <div id="facilitiesList" class="table-wrap"></div>
  </section>

  <section id="reservations" class="tab-panel">
    <div class="section-head"><h2>Reservations</h2><button id="newReservationBtn" class="btn primary requester-only">New Reservation</button></div>
    <div id="reservationFormWrap" class="card hidden">
      <h3>Submit Reservation Request</h3>
      <form id="reservationForm" class="grid-form">
        <div><label>Facility</label><select id="reservationFacility" required></select></div>
        <div><label>Purpose</label><input id="reservationPurpose" required></div>
        <div><label>Start</label><input id="reservationStart" type="datetime-local" required></div>
        <div><label>End</label><input id="reservationEnd" type="datetime-local" required></div>
        <div class="full actions"><button class="btn primary">Submit as Pending</button><button type="button" id="cancelReservation" class="btn secondary">Cancel</button></div>
      </form>
      <p id="reservationError" class="error"></p>
    </div>
    <div id="reservationsList" class="table-wrap"></div>
  </section>

  <section id="services" class="tab-panel">
    <div class="section-head"><h2>Service Requests</h2><button id="newServiceBtn" class="btn primary staff-only">Create Request</button></div>
    <div id="serviceFormWrap" class="card hidden">
      <form id="serviceForm" class="grid-form">
        <div><label>Facility</label><select id="serviceFacility" required></select></div>
        <div><label>Concern</label><input id="serviceConcern" required></div>
        <div class="full"><label>Description</label><textarea id="serviceDescription" rows="4" required></textarea></div>
        <div class="full actions"><button class="btn primary">Save</button><button type="button" id="cancelService" class="btn secondary">Cancel</button></div>
      </form>
    </div>
    <div id="servicesList" class="table-wrap"></div>
  </section>

  <section id="audit" class="tab-panel">
    <h2>Audit Logs</h2>
    <div id="auditList" class="table-wrap"></div>
  </section>
</main>
<div id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
